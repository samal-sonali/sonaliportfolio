<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sonali Samal — Frontend Developer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sonali Samal is a Frontend Developer in Hyderabad building responsive, pixel-perfect web apps with Angular, JavaScript, HTML, CSS, Tailwind and Bootstrap."
    />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0c12" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Sonali Samal — Frontend Developer" />
    <meta
      property="og:description"
      content="Responsive, pixel-perfect web interfaces with Angular, JavaScript and modern CSS."
    />
    <meta property="og:image" content="sonali.jpg" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
