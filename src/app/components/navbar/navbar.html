<header class="nav" [class.scrolled]="scrolled() || menuOpen()">
  <div class="progress" [style.transform]="'scaleX(' + progress() + ')'"></div>

  <div class="container nav-inner">
    <a href="#top" class="brand" (click)="menuOpen.set(false)" aria-label="Back to top">
      <span class="logo">{{ profile.initials }}</span>
      <span class="brand-name">{{ profile.name }}</span>
    </a>

    <nav class="links" aria-label="Primary">
      @for (link of links; track link.id) {
        <a [href]="'#' + link.id" [class.active]="active() === link.id">{{ link.label }}</a>
      }
    </nav>

    <div class="actions">
      <button
        class="icon-btn"
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>
      <a href="#contact" class="btn btn-primary hire">Let’s talk</a>
      <button
        class="icon-btn burger"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        aria-label="Toggle menu"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="20" />
      </button>
    </div>
  </div>

  <div id="mobile-menu" class="mobile" [class.open]="menuOpen()">
    <nav class="container" aria-label="Mobile">
      @for (link of links; track link.id; let i = $index) {
        <a
          [href]="'#' + link.id"
          (click)="menuOpen.set(false)"
          [style.transition-delay]="menuOpen() ? 60 + i * 40 + 'ms' : '0ms'"
        >
          <span class="num">0{{ i + 1 }}</span>{{ link.label }}
        </a>
      }
      <a href="#contact" class="btn btn-primary" (click)="menuOpen.set(false)">
        Let’s talk <app-icon name="arrow" [size]="18" />
      </a>
    </nav>
  </div>
</header>
