<section id="contact" class="section">
  <div class="container">
    <div class="panel" reveal>
      <div class="glow" aria-hidden="true"></div>

      <div class="left">
        <span class="eyebrow">Contact</span>
        <h2 class="section-title">
          Have a project in mind? <span class="serif">Let’s build it together.</span>
        </h2>
        <p class="lead">
          I’m open to frontend roles and collaborations, especially Angular projects. My inbox is always open.
        </p>

        <div class="channels">
          <button type="button" class="channel" (click)="copyEmail()">
            <span class="c-icon"><app-icon name="mail" [size]="20" /></span>
            <span class="c-text">
              <small>{{ copied() ? 'Copied to clipboard!' : 'Email · click to copy' }}</small>
              <strong>{{ profile.email }}</strong>
            </span>
            <app-icon class="c-end" [name]="copied() ? 'check' : 'copy'" [size]="18" />
          </button>

          <a class="channel" [href]="profile.linkedin" target="_blank" rel="noopener">
            <span class="c-icon"><app-icon name="linkedin" [size]="20" /></span>
            <span class="c-text">
              <small>LinkedIn</small>
              <strong>Connect with me</strong>
            </span>
            <app-icon class="c-end" name="arrowUpRight" [size]="18" />
          </a>

          <div class="channel static">
            <span class="c-icon"><app-icon name="pin" [size]="20" /></span>
            <span class="c-text">
              <small>Based in</small>
              <strong>{{ profile.location }}</strong>
            </span>
          </div>
        </div>
      </div>

      <form class="form" #f="ngForm" (ngSubmit)="f.valid && send()">
        <h3>Send a message</h3>
        <label>
          <span>Your name</span>
          <input name="name" [(ngModel)]="name" required autocomplete="name" placeholder="Jane Doe" />
        </label>
        <label>
          <span>Your email</span>
          <input name="email" type="email" [(ngModel)]="email" email autocomplete="email" placeholder="jane@company.com" />
        </label>
        <label>
          <span>Message</span>
          <textarea name="message" [(ngModel)]="message" required rows="5" placeholder="Tell me about your project or role…"></textarea>
        </label>
        <button type="submit" class="btn send" [disabled]="f.invalid">
          Send message <app-icon name="send" [size]="17" />
        </button>
        <small class="hint">Opens your email app with the message ready to send.</small>
      </form>
    </div>
  </div>
</section>
